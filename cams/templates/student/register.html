{% extends "base/auth_base.html" %}

{% block title %}Student Registration - CAMS{% endblock %}

{% block extra_head %}
<script>
function suggestAIPassword() {
    const length = 14;
    const charset = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()_+~`|}{[]:;?><,./-=";
    let retVal = "";
    
    // Ensure at least one of each required type
    retVal += "ABCDEFGHIJKLMNOPQRSTUVWXYZ".charAt(Math.floor(Math.random() * 26));
    retVal += "abcdefghijklmnopqrstuvwxyz".charAt(Math.floor(Math.random() * 26));
    retVal += "0123456789".charAt(Math.floor(Math.random() * 10));
    retVal += "!@#$%^&*".charAt(Math.floor(Math.random() * 8));
    
    for (let i = 4, n = charset.length; i < length; ++i) {
        retVal += charset.charAt(Math.floor(Math.random() * n));
    }
    
    // Shuffle the result
    retVal = retVal.split('').sort(function(){return 0.5-Math.random()}).join('');
    
    const passwordInput = document.getElementById('password');
    const confirmInput = document.getElementById('confirm_password');
    
    passwordInput.value = retVal;
    confirmInput.value = retVal;
    
    // Change to text type momentarily to show the password, or just flash success
    passwordInput.type = 'text';
    confirmInput.type = 'text';
    
    // Find icons and update them
    const icons = document.querySelectorAll('.password-toggle');
    icons.forEach(icon => {
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
    });

    // Create a temporary toast-like notification
    const feedback = document.createElement('div');
    feedback.innerHTML = '<i class="fas fa-magic me-2"></i> Strong AI password suggested and applied!';
    feedback.style.cssText = 'position: fixed; top: 20px; right: 20px; background: #0ea5e9; color: white; padding: 12px 20px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); z-index: 9999; font-weight: 600; animation: slideIn 0.3s ease-out;';
    document.body.appendChild(feedback);
    
    setTimeout(() => {
        feedback.style.opacity = '0';
        feedback.style.transition = 'opacity 0.5s ease';
        setTimeout(() => feedback.remove(), 500);
    }, 3000);
}

// Add keyframes for the notification
const style = document.createElement('style');
style.innerHTML = `
    @keyframes slideIn {
        from { transform: translateX(100%); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
    }
`;
document.head.appendChild(style);
</script>
{% endblock %}

{% block auth_content %}
<h2 class="auth-form-title">Register</h2>
<div class="auth-form-subtitle">Create your CAMS account.</div>

<form method="POST" action="{{ url_for('student.register') }}">

    <div class="form-row">
        <div class="form-col">
            <div class="form-floating">
                <input type="text" autocomplete="off" class="form-control" id="first_name" name="first_name" placeholder="First Name" 
                    required minlength="3" pattern="[A-Za-z]+" title="At least 3 letters, no numbers or special characters">
                <label for="first_name">First Name</label>
            </div>
        </div>
        <div class="form-col">
            <div class="form-floating">
                <input type="text" autocomplete="off" class="form-control" id="last_name" name="last_name" placeholder="Last Name" 
                    required minlength="3" pattern="[A-Za-z]+" title="At least 3 letters, no numbers or special characters">
                <label for="last_name">Last Name</label>
            </div>
        </div>
    </div>

    <div class="form-floating">
        <input type="email" autocomplete="off" class="form-control" id="email" name="email" placeholder="Student Email" required>
        <label for="email">Student Email</label>
    </div>

    <div class="form-floating">
        <input type="text" autocomplete="off" class="form-control" id="reg_no" name="reg_no"
            placeholder="Registration No. (e.g. S13/00000/22)" pattern="^[A-Za-z]{1}[0-9]{2}/[0-9]{5}/[0-9]{2}$"
            title="Format: S13/07803/22" required>
        <label for="reg_no">Registration No. (e.g. S13/00000/22)</label>
    </div>

    <div class="form-floating">
        <input type="text" autocomplete="off" class="form-control" id="course" name="course" placeholder="Course / Degree" required>
        <label for="course">Course / Degree</label>
    </div>

    <div class="form-row">
        <div class="form-col">
            <div class="form-floating password-wrapper">
                <input type="password" class="form-control" id="password" name="password" placeholder="Password" minlength="6" required>
                <label for="password">Password</label>
                <i class="fas fa-eye password-toggle" onclick="togglePassword('password', this)"></i>
            </div>
        </div>
        <div class="form-col">
            <div class="form-floating password-wrapper">
                <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Confirm Password" required>
                <label for="confirm_password">Confirm Password</label>
                <i class="fas fa-eye password-toggle" onclick="togglePassword('confirm_password', this)"></i>
            </div>
        </div>
    </div>

    <div class="mb-3 text-end">
        <button type="button" class="btn btn-sm btn-outline-info border-0" onclick="suggestAIPassword()" style="font-size: 0.85rem; border-radius: 12px; background: rgba(13, 202, 240, 0.05);">
            <i class="fas fa-robot me-1"></i> Suggest AI Password
        </button>
    </div>

    <button type="submit" class="btn-auth">Create Account</button>
</form>

<div class="auth-links">
    <a href="{{ url_for('student.login') }}">Already have an account? Login</a>
</div>
{% endblock %}
