<!-- Floating AI Help Button -->
<button class="ai-help-btn" id="aiHelpBtn" aria-label="Open AI Help Center">
    <i class="fas fa-question"></i>
</button>

<!-- AI Help Chat Modal/Panel -->
<div class="ai-help-panel" id="aiHelpPanel">
    <div class="ai-help-header">
        <div class="ai-header-info">
            <div class="ai-avatar">
                <i class="fas fa-robot"></i>
            </div>
            <div class="ai-title">
                <h5>CAMS Assistant</h5>
                <span>Ask me anything!</span>
            </div>
        </div>
        <button class="ai-close-btn" id="aiHelpCloseBtn">
            <i class="fas fa-times"></i>
        </button>
    </div>
    
    <div class="ai-help-body" id="aiHelpBody">
        <div class="ai-message ai-system">
            <div class="ai-msg-content">
                Hello! I am your CAMS AI Assistant. How can I help you today?
            </div>
        </div>
        <!-- Messages will be injected here -->
    </div>
    
    <div class="ai-help-footer">
        <form id="aiHelpForm">
            <input type="text" id="aiHelpInput" placeholder="Type your question..." required autocomplete="off">
            <button type="submit" id="aiHelpSubmitBtn" aria-label="Send Message">
                <i class="fas fa-paper-plane"></i>
            </button>
        </form>
    </div>
</div>

<style>
/* AI Help Center Styles */
.ai-help-btn {
    position: fixed;
    bottom: 30px;
    right: 30px;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--g700, #1d4ed8), var(--g500, #3b82f6));
    color: white;
    border: none;
    box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    cursor: pointer;
    z-index: 9999;
    transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s;
}

.ai-help-btn:hover {
    transform: scale(1.1);
    box-shadow: 0 6px 20px rgba(59, 130, 246, 0.6);
}

.ai-help-panel {
    position: fixed;
    bottom: 100px;
    right: 30px;
    width: 360px;
    height: 500px;
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(226, 232, 240, 0.8);
    border-radius: 20px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
    display: flex;
    flex-direction: column;
    z-index: 9999;
    opacity: 0;
    pointer-events: none;
    transform: translateY(20px) scale(0.95);
    transform-origin: bottom right;
    transition: opacity 0.3s, transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    overflow: hidden;
}

.ai-help-panel.active {
    opacity: 1;
    pointer-events: auto;
    transform: translateY(0) scale(1);
}

.ai-help-header {
    padding: 16px 20px;
    background: linear-gradient(135deg, var(--g900, #1e3a8a), var(--g700, #1d4ed8));
    color: white;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.ai-header-info {
    display: flex;
    align-items: center;
    gap: 12px;
}

.ai-avatar {
    width: 36px;
    height: 36px;
    background: rgba(255, 255, 255, 0.2);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
}

.ai-title h5 {
    margin: 0;
    font-size: 15px;
    font-weight: 700;
    font-family: 'Outfit', sans-serif;
}

.ai-title span {
    font-size: 11px;
    opacity: 0.8;
}

.ai-close-btn {
    background: transparent;
    border: none;
    color: white;
    font-size: 18px;
    cursor: pointer;
    opacity: 0.7;
    transition: opacity 0.2s;
}

.ai-close-btn:hover {
    opacity: 1;
}

.ai-help-body {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
    background: #f8fafc;
}

.ai-message {
    display: flex;
    max-width: 85%;
    animation: fadeIn 0.3s ease-out;
}

.ai-message.ai-system {
    align-self: flex-start;
}

.ai-message.ai-user {
    align-self: flex-end;
}

.ai-msg-content {
    padding: 12px 16px;
    border-radius: 16px;
    font-size: 13.5px;
    line-height: 1.5;
    word-wrap: break-word;
}

.ai-system .ai-msg-content {
    background: white;
    color: #334155;
    border: 1px solid #e2e8f0;
    border-bottom-left-radius: 4px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.02);
}

.ai-user .ai-msg-content {
    background: linear-gradient(135deg, var(--g600, #2563eb), var(--g500, #3b82f6));
    color: white;
    border-bottom-right-radius: 4px;
    box-shadow: 0 2px 6px rgba(59, 130, 246, 0.2);
}

.ai-msg-content p {
    margin: 0 0 8px 0;
}

.ai-msg-content p:last-child {
    margin-bottom: 0;
}

.ai-msg-content ul, .ai-msg-content ol {
    margin: 8px 0;
    padding-left: 20px;
}

.ai-msg-content code {
    background: #f1f5f9;
    padding: 2px 4px;
    border-radius: 4px;
    font-size: 12px;
}

.ai-user .ai-msg-content code {
    background: rgba(255,255,255,0.2);
    color: white;
}

.ai-help-footer {
    padding: 16px;
    background: white;
    border-top: 1px solid #e2e8f0;
}

#aiHelpForm {
    display: flex;
    gap: 10px;
}

#aiHelpInput {
    flex: 1;
    border: 1px solid #cbd5e1;
    border-radius: 20px;
    padding: 10px 16px;
    font-size: 13.5px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
}

#aiHelpInput:focus {
    border-color: var(--g400, #60a5fa);
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
}

#aiHelpSubmitBtn {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: var(--g600, #2563eb);
    color: white;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
}

#aiHelpSubmitBtn:hover {
    background: var(--g700, #1d4ed8);
}

#aiHelpSubmitBtn:active {
    transform: scale(0.95);
}

#aiHelpSubmitBtn:disabled {
    background: #94a3b8;
    cursor: not-allowed;
}

.ai-typing-indicator {
    display: flex;
    gap: 4px;
    padding: 12px 16px;
    background: white;
    border: 1px solid #e2e8f0;
    border-radius: 16px;
    border-bottom-left-radius: 4px;
    width: fit-content;
    align-self: flex-start;
}

.ai-dot {
    width: 6px;
    height: 6px;
    background: #cbd5e1;
    border-radius: 50%;
    animation: typingBounce 1.4s infinite ease-in-out both;
}

.ai-dot:nth-child(1) { animation-delay: -0.32s; }
.ai-dot:nth-child(2) { animation-delay: -0.16s; }

@keyframes typingBounce {
    0%, 80%, 100% { transform: scale(0); }
    40% { transform: scale(1); }
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 480px) {
    .ai-help-panel {
        width: calc(100% - 40px);
        right: 20px;
        bottom: 90px;
    }
    
    .ai-help-btn {
        right: 20px;
        bottom: 20px;
    }
}
</style>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const aiBtn = document.getElementById('aiHelpBtn');
    const aiPanel = document.getElementById('aiHelpPanel');
    const aiClose = document.getElementById('aiHelpCloseBtn');
    const aiForm = document.getElementById('aiHelpForm');
    const aiInput = document.getElementById('aiHelpInput');
    const aiBody = document.getElementById('aiHelpBody');
    const aiSubmitBtn = document.getElementById('aiHelpSubmitBtn');
    
    // Check if elements exist
    if (!aiBtn || !aiPanel) return;

    // Toggle Panel
    aiBtn.addEventListener('click', () => {
        aiPanel.classList.toggle('active');
        if(aiPanel.classList.contains('active')) {
            aiInput.focus();
            scrollToBottom();
        }
    });

    aiClose.addEventListener('click', () => {
        aiPanel.classList.remove('active');
    });

    // Close on click outside
    document.addEventListener('click', (e) => {
        if(aiPanel.classList.contains('active') && 
           !aiPanel.contains(e.target) && 
           !aiBtn.contains(e.target)) {
            aiPanel.classList.remove('active');
        }
    });

    function scrollToBottom() {
        aiBody.scrollTop = aiBody.scrollHeight;
    }

    function addMessage(content, sender, isHtml = false) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `ai-message ai-${sender}`;
        
        const contentDiv = document.createElement('div');
        contentDiv.className = 'ai-msg-content';
        
        if (isHtml) {
            contentDiv.innerHTML = content;
        } else {
            contentDiv.textContent = content;
        }
        
        msgDiv.appendChild(contentDiv);
        aiBody.appendChild(msgDiv);
        scrollToBottom();
    }

    function showTyping() {
        const typingDiv = document.createElement('div');
        typingDiv.className = 'ai-typing-indicator';
        typingDiv.id = 'aiTypingIndicator';
        typingDiv.innerHTML = '<div class="ai-dot"></div><div class="ai-dot"></div><div class="ai-dot"></div>';
        aiBody.appendChild(typingDiv);
        scrollToBottom();
    }

    function removeTyping() {
        const typingDiv = document.getElementById('aiTypingIndicator');
        if(typingDiv) typingDiv.remove();
    }

    aiForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const question = aiInput.value.trim();
        if(!question) return;
        
        // Add user message
        addMessage(question, 'user');
        aiInput.value = '';
        aiSubmitBtn.disabled = true;
        
        // Show typing indicator
        showTyping();
        
        try {
            const response = await fetch('/help/ask', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ question: question })
            });
            
            const data = await response.json();
            removeTyping();
            
            if(response.ok) {
                addMessage(data.answer, 'system', true);
            } else {
                addMessage(data.error || "Sorry, I couldn't process your request.", 'system');
            }
        } catch(error) {
            removeTyping();
            addMessage("Network error. Please try again later.", 'system');
        } finally {
            aiSubmitBtn.disabled = false;
            aiInput.focus();
        }
    });
});
</script>
